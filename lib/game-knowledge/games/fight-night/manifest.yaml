metaOverview: Fight Night Champion competitive meta is built around impact scoring,
  stamina wars, and rhythm control — not punch totals. Elite OWC/H2H play centers on
  Money Team block rhythms, power straight timing, sidestep uppercuts, recovery punishes,
  and scorecard manipulation in the final 20–30 seconds of close rounds. Top players win
  meaningful moments, control timing, and punish commitment rather than chasing volume.
