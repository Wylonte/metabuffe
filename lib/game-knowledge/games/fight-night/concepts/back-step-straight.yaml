id: back-step-straight
name: Push Straight Counter Reads
aliases:
  - back step straight
  - beat push straight
category: counterplay
definition: >-
  Countering push straight / straight spam by stepping off line or firing through
  recovery after the straight. Push straight spam works when opponents stay on the
  centerline — break the line or punish the recovery.
whyItWorks: >-
  Push straights track linear paths. Sidestep uppercuts, power straights on
  recovery, and angle changes deny the centerline control push straight spam needs.
whenEffective:
  - Opponent repeating push straights without reading movement
  - After absorbing straight with block refresh
counters:
  - name: Sidestep uppercut
    explanation: Break linear tracking when push straight spam is predictable
  - name: Power straight on recovery
    explanation: Fire after blocking the push straight
overuseSignals:
  - Standing on centerline while opponent push straight spams
related:
  - push-straight
  - sidestep-uppercut
  - power-straight
communityTerms:
  - push straight spam
