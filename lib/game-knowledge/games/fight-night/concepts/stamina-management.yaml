id: stamina-management
name: Stamina Management
aliases:
  - stamina management
  - preserve stamina
category: strategy
definition: >-
  Managing stamina for meaningful offense across rounds — avoiding stamina fraud
  (unsustainable early activity) and applying stamina tax (making opponent waste
  resources).
whyItWorks: >-
  FNC output drops sharply with stamina. Elite players preserve gas for impact
  moments and round steals instead of empty offense.
whenEffective:
  - Mid-to-late rounds when opponent shows stamina fraud
  - When playing power disadvantage — need cleaner, fewer mistakes
counters:
  - name: Stamina tax
    explanation: Force opponent to spend stamina on misses and chase
overuseSignals:
  - Wasted movement and missed power early
  - Throwing combinations when one meaningful shot would suffice
related:
  - stamina-fraud
  - stamina-tax
  - empty-offense
communityTerms:
  - stamina management
