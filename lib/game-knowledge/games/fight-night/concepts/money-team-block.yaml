id: money-team-block
name: Money Team Block / Money Team Defense
aliases:
  - money team defense
  - money team block
  - mtb
  - shell
category: mechanic
definition: >-
  Core FNC meta defensive-offensive system — NOT simply holding block. Built around
  defensive rhythm manipulation, weave-reset defense, pump blocking, subtle movement,
  and free offense creation. Shell minimizes vulnerability while constantly threatening
  counter offense. Distinct from Static Block.
whyItWorks: >-
  Makes opponents attack the guard instead of the rhythm. Creates calculated annoyance,
  defensive frustration, and free offense (often power straight) on commitment.
whenEffective:
  - OWC/H2H high-level exchanges
  - When opponent overextends into shell
  - When paired with power straight counter threat
counters:
  - name: Attack the rhythm
    explanation: Slow the fight, lateral movement without committing, body during reset — not emotional combos at the shell
  - name: Make them refresh early
    explanation: Step into range without throwing to force premature block refresh, then attack the reset
overuseSignals:
  - Holding block without counter threat or refresh (Static Block)
  - Predictable block-tap rhythm without adaptation
related:
  - money-team-rhythm
  - power-straight
  - block-refresh
  - pump-block
  - weave-reset
  - static-block
  - calculated-annoyance
  - defensive-frustration
  - free-offense
communityTerms:
  - Money Team
  - MTB
  - shell
