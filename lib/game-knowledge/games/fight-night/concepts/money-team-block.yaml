id: money-team-block
name: Money Team Block / Money Team Defense
aliases:
  - money team defense
  - money team block
  - mtb
  - shell
category: mechanic
definition: >-
  Active defensive system built around block management, weaving/head movement,
  guard refreshing, positioning, and immediate counter offense — not static high guard.
  Rhythm is block → refresh → weave/movement → reset → counter (often power straight).
whyItWorks: >-
  Makes opponents attack the guard instead of the rhythm. Offensive threat out of
  defense forces hesitation and creates counter windows on commitment.
whenEffective:
  - OWC/H2H high-level exchanges
  - When opponent overextends into shell
  - When paired with power straight counter threat
counters:
  - name: Attack the rhythm
    explanation: Slow the fight, lateral movement without committing, body during reset — not emotional combos at the shell
  - name: Make them refresh early
    explanation: Step into range without throwing to force premature block refresh
overuseSignals:
  - Holding block without counter threat or refresh
  - Predictable block-tap rhythm
related:
  - power-straight
  - block-refresh
  - block-hold-pattern
communityTerms:
  - Money Team
  - MTB
  - shell
