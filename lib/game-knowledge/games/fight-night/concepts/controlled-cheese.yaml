id: controlled-cheese
name: Controlled Cheese
aliases:
  - controlled cheese
  - cheese
category: strategy
definition: >-
  Deliberate use of powerful or exploitable FNC mechanics based on reads rather
  than blind repetition — timed power straights, sidestep uppercuts on predictable
  entry, Money Team defense into counter offense.
whyItWorks: >-
  FNC rewards players who land high-impact mechanics at the right moment. Controlled
  cheese converts reads into round-swinging moments without stamina fraud.
whenEffective:
  - Sidestep uppercut after third straight-line entry
  - Power straight through block refresh punish
  - Money Team rhythm into counter
counters:
  - name: Adaptation check
    explanation: Stop repeating the entry that feeds the cheese
  - name: Rhythm manipulation
    explanation: Break the pattern they are cheesing against
overuseSignals:
  - Same cheese attempt without confirming the read still exists
  - Mindless repetition — that is spam, not controlled cheese
related:
  - push-straight
  - sidestep-uppercut
  - money-team-block
communityTerms:
  - controlled cheese
  - cheese
