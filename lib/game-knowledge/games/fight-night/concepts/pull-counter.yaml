id: pull-counter
name: Pull Counter
aliases:
  - pull counter
  - pull straight
category: counterplay
definition: >-
  Classification: Established Community. Slight backward pull or lean to make an
  opponent's jab or straight miss, then fire a straight or power shot through the
  recovery window. Distinct from a plain backstep (distance) and from lean-back
  without an immediate counter.
whyItWorks: >-
  FNC rewards clean counter impact. Pull counters steal rounds by landing power
  while the opponent is still committed forward.
whenEffective:
  - Against predictable jab-straight rhythm
  - When opponent pressures in straight lines
  - Close rounds where one power counter swings judges
counters:
  - name: Delay second punch
    explanation: Break the timing they are pulling against
  - name: Attack body on pull
    explanation: Pulling upstairs can open the body line
overuseSignals:
  - Pulling without reading the entry
  - Repeated pulls when opponent stops leading
  - Calling pull counter when only lean-back with no counter is visible
related:
  - power-straight
  - lean-back
  - recovery-punish
communityTerms:
  - pull counter
  - pull straight
