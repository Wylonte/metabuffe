id: mechanic-on-read
name: Mechanic Used on a Read
aliases:
  - using mechanics on reads
  - read-based cheese
  - timed mechanic
category: strategy
definition: >-
  Deliberate use of a strong FNC mechanic after a clear read — timed power straight,
  sidestep uppercut on linear entry, Money Team defense into counter. Master Spec
  preferred term when this fits: Controlled Cheese. Different from mindless spam.
whyItWorks: >-
  High-impact FNC mechanics win rounds when timed to opponent commitment, not when
  repeated without a trigger.
whenEffective:
  - After opponent shows the same entry or release timing twice or more
counters:
  - name: Stop feeding the read
    explanation: Change the trigger pattern they are waiting for
overuseSignals:
  - Same mechanic with no remaining read — that is mindless spam, not a read-based use
related:
  - controlled-cheese
  - sidestep-uppercut
  - power-straight
  - money-team-block
  - mindless-spam
communityTerms:
  - Controlled Cheese
  - cheese on a read
