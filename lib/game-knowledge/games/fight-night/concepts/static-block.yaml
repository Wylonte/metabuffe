id: static-block
name: Static Block
aliases:
  - static guard
  - sitting in block
category: mechanic
definition: >-
  Holding guard without sufficient movement, refreshing, counter threat, or positional
  adjustment. Different from active Money Team defense.
whyItWorks: >-
  Can absorb briefly but becomes predictable and easier to pressure without counter threat.
whenEffective:
  - Brief moments to reset stamina
counters:
  - name: Body and rhythm pressure
    explanation: Force movement or punish lack of counter threat
overuseSignals:
  - Permanently holding block under pressure
related:
  - money-team-block
  - panic-defense
communityTerms:
  - static block
